name: Build

on: [push, pull_request, workflow_dispatch]

env:
  # Set DOREADTHEDOCS to
  #   - "true" if this version is to be loaded to ReadTheDocs
  #   - "false" otherwise
  DOREADTHEDOCS: "true"
  # Set DORELEASE to
  #   - "true" if this version is to be loaded to PyPI
  #   - "false" if this version is to be loaded to TestPyPI
  DORELEASE: "false"

jobs:
  # Job to buildwheels on all platforms
  build_wheels:
    name: Build wheels on ${{ matrix.job-name}}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - job-name: "Linux"
            os: "ubuntu-24.04"

          - job-name: "macOS"
            os: "macos-14"
            xcode-version: "15.2"

          - job-name: "Windows"
            os: "windows-2022"

    outputs:
      doreadthedocs: ${{ steps.rtd.outputs.doreadthedocs }}
      dorelease: ${{ steps.rtd.outputs.dorelease }}

    steps:
      # see https://github.com/travis-ci/travis-ci/issues/6069#issuecomment-266546552
      # and https://stackoverflow.com/a/53409848/584201
      # A full checkout allows the git derived build number to work working (based on git log and rev-list)
      - name: Checkout the source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # Used to host cibuildwheel
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      #- name: Install Conan
      #  id: conan
      #  uses: turtlebrowser/get-conan@main

      #- name: Conan version
      #  run: echo "${{ steps.conan.outputs.version }}"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel~=3.3.0

      # From windows image 2025 winget-cli is available to perform this
      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        run: |
          $version = "1.4.341.0"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe" -OutFile VulkanSDK.exe
          Start-Process -FilePath VulkanSDK.exe -Args "--accept-licenses --default-answer --confirm-command install" -Wait
          echo "VULKAN_SDK=C:\VulkanSDK\$version" >> $env:GITHUB_ENV
        shell: pwsh
      # cibuildwheel settings are mostly in the pyproject.toml file
      # Test the cibuildwheel action
      # cibuildwheel derives platform automatically on CI
      # Local run use --platform windows/linx/macos
      - name: Build wheels
        env:
          ARTIFACTORY_RO_PASSWORD: ${{ secrets.ARTIFACTORY_RO_PASSWORD }}
        run: python -m cibuildwheel --debug-traceback --output-dir wheelhouse
      
      - name: Save demo
        if: runner.os == 'Linux'
        run: | 
          zip -r demos.zip demos/

      - name: Upload demo
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with: 
          name: demos.zip
          path: ./demos.zip
          retention-days: 1
          if-no-files-found: error

      - id: rtd
        run: |
          echo "::set-output name=doreadthedocs::$DOREADTHEDOCS"
          echo "::set-output name=dorelease::$DORELEASE"
      # Temporary storage of job results
      # In later steps are collected and uploaded to (Test)PyPI
      # The default upload name is artifact but a name can be supplied
      - uses: actions/upload-artifact@v7
        with:
          name: nptsne_wheels_${{matrix.job-name}}
          path: ./wheelhouse/*.whl
          retention-days: 1
          if-no-files-found: error

  # TODO Add job to build sdist
  # Job to upload all artifacts after wheel & sdist build
  # Steps:
  #   1) Download artifacts from temp store
  #   2) Upload to either :
  #      a) - TestPyPI if no release tag
  #      b) - PyPI if release tag

  upload_PyPI:
    name: Upload artifacts to pyPI or TestPyPI
    outputs:
      nptsneversion: ${{ steps.wheel_version.outputs.wheelver }}
    needs: [build_wheels]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the source
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: nptsne_wheels_*
          path: ./dist
          merge-multiple: true

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install packaging>=21.0
          ls ./dist
          ls -a .

      - name: Get the version from the artifact names
        id: wheel_version
        shell: python
        run: |
          from pathlib import Path
          from packaging.utils import parse_wheel_filename
          import os
          p = Path("./dist")
          l = list(p.glob('*.whl'))
          tup = parse_wheel_filename(l[0].name)
          strtup = str(tup[1])
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            print(f"tag=v{strtup}\n", file=f)
            print(f"wheelver={strtup}\n", file=f)

      - name: Tag using v + VERSION
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN  }}
          custom_tag: ${{ steps.wheel_version.outputs.wheelver }}
          tag_prefix: "v"

      - name: Publish wheels to PyPI
        if: ${{ needs.build_wheels.outputs.dorelease == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1.13
        with:
          password: ${{ secrets.PYPI_TOKEN_SECRET  }}
          packages-dir: ./dist/
          skip-existing: true
          verbose: true

      - name: Publish wheels to TestPyPI
        if: ${{ needs.build_wheels.outputs.dorelease == 'false' }}
        uses: pypa/gh-action-pypi-publish@release/v1.13
        with:
          password: ${{ secrets.TESTPYPI_TOKEN_SECRET  }}
          repository-url: https://test.pypi.org/legacy/
          packages-dir: ./dist/
          skip-existing: true
          verbose: true


  #   1) If the upload succeeds trigger either :
  #      ReadTheDocs if DOREADTHEDOCS was true
  # (Note that RTD API v3 needs its own token)

  complete_demos:
    name: Make the demo.zip externally available as draft
    needs: [build_wheels, upload_PyPI]
    runs-on: ubuntu-latest    
    steps:
    - name: Download demo artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: demos.zip
        merge-multiple: true

    # Even thought eh upload to (Test)PyPI has succeeded
    # the wheel takes some time to become visible
    # Use a local copy to avoid issues
    - name: Download wheel artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: nptsne_wheels_*
        path: ./dist
        merge-multiple: true
    - name: Wait for nptsne to appear on (Test)PyPI
      shell: bash
      env:
        VERSION: ${{ needs.upload_PyPI.outputs.nptsneversion }}  # or set dynamically from your version file
      run: |
        URL1="https://test.pypi.org/pypi/nptsne/${VERSION}/json"
        URL2="https://pypi.org/pypi/nptsne/${VERSION}/json"
        MAX_ATTEMPTS=30
        WAIT_SECONDS=10
        
        for i in $(seq 1 $MAX_ATTEMPTS); do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL1")
          if [ "$STATUS" = "200" ]; then
            echo "** nptsne ${VERSION} is available on TestPyPI"
            exit 0
          fi
          echo "Attempt $i/${MAX_ATTEMPTS}: HTTP ${STATUS}, retrying in ${WAIT_SECONDS}s..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL2")
          if [ "$STATUS" = "200" ]; then
            echo "** nptsne ${VERSION} is available on PyPI"
            exit 0
          fi
          echo "Attempt $i/${MAX_ATTEMPTS}: HTTP ${STATUS}, retrying in ${WAIT_SECONDS}s..."
          sleep $WAIT_SECONDS
        done
        
        echo "!! Timed out after $((MAX_ATTEMPTS * WAIT_SECONDS))s waiting for nptsne ${VERSION}"
        exit 1      
    - name: Install uv and zip 
      uses: astral-sh/setup-uv@v5
    - name: Save demo
      run: | 
        # python -m pip debug --verbose | grep manylinux
        unzip demos.zip
        cd demos
        echo Contents of demos
        ls .
        echo Update uv.lock
        sleep 10
        export UV_HTTP_CONNECT_TIMEOUT=30
        export UV_HTTP_RETRIES=10
        export UV_HTTP_TIMEOUT=120
        # uv sync --dry-run --python 3.13 --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/  2>&1 | head -50
        # uv sync --python 3.13 --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ 
        uv lock --upgrade
        cd ..
        echo Package necessary demo subset
        python -m pip install zenodo-get
        python ./demos/create_demo_zip.py
        ls -al 

    - name: Upload completed demo blob to draft release
      uses: softprops/action-gh-release@v2
      with:
        draft: true
        tag_name: staging-${{ github.run_id }}
        working_directory: .
        files: demos.zip

  do_read_the_docs:
    name: Add documentation to read the docs
    needs: [upload_PyPI]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.upload_PyPI.outputs.nptsneversion }}
      RTD_TOKEN: ${{ secrets.READTHEDOCS_TOKEN  }}
    if: ${{ needs.build_wheels.outputs.doreadthedocs == 'true' }}

    steps:
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Verify wheel upload - to test.pypi.org
        if: ${{ needs.build_wheels.outputs.dorelease == 'false' }}
        run: |
          import os
          import requests
          r=requests.get(f'https://test.pypi.org/project/nptsne/{os.environ["VERSION"]}')
          exit(0) if r.status_code==200 else exit(1)
        shell: python

      # The new version (tagged as v + VERSION above) is activated and built in readthedocs
      - name: Activate new version and trigger ReadTheDocs
        run: |
          # Activate new version
          echo Patch in the new version
          curl \
            -X PATCH \
            -H "Authorization: Token $RTD_TOKEN" https://readthedocs.org/api/v3/projects/nptsne/versions/v$VERSION/ \
            -H "Content-Type: application/json" \
            -d '{"active": true, "hidden": false}'
          # Trigger build
          echo Trigger the build
          curl \
            -X POST \
            -H "Authorization: Token $RTD_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"active": true, "hidden": false}' https://readthedocs.org/api/v3/projects/nptsne/versions/v$VERSION/builds/
