[project]
name = "nptsnedemos"
version = "2.0.0a10"
description = "Demonstration scripts for nptsne"
dependencies = [
  "nptsne==2.0.0a10",
  "PyQt6==6.9.0",
  "matplotlib==3.10.1",
  "scipy==1.15.2",
  "numpy==2.2.4",https://productionresultssa8.blob.core.windows.net/actions-results/4e1aeb49-e25b-4de5-ac53-3162db8874cc/workflow-job-run-7df23650-7924-5e26-9695-01791f2cd42f/logs/job/job-logs.txt?rsct=text%2Fplain&se=2026-04-01T14%3A39%3A05Z&sig=0Zi5Fw5gdmeUla9vND0ZVifox1Z8o1tnUZO6Z586iFc%3D&ske=2026-04-01T16%3A22%3A14Z&skoid=ca7593d4-ee42-46cd-af88-8b886a2f84eb&sks=b&skt=2026-04-01T12%3A22%3A14Z&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skv=2025-11-05&sp=r&spr=https&sr=b&st=2026-04-01T14%3A29%3A00Z&sv=2025-11-05
  "pandas==2.2.3",
  "Pillow==11.1.0",
  "notebook==7.5.5",
  "networkx==3.4.2",
  "python-louvain==0.16",
  "pywin32; sys_platform == 'win32'",
  "umap-learn==0.5.11",
  "zenodo-get==3.0.0"
]
requires-python = ">=3.11"

[project.scripts]
BasicHSNEDemo = "nptsnedemos.BasicHSNEDemo.hsnedemo:main"
ExtendedHSNEDemo = "nptsnedemos.ExtendedHSNEDemo.hsnedemo:main"
HSNELouvainDemo = "nptsnedemos.HSNELouvainDemo.testhsnelouvain:main"
SimpleTsne = "nptsnedemos.SimpleTsne.test:main"
ExtendedTsne = "nptsnedemos.ExtendedTsne.testtextureextended:main"
DocTest = "nptsnedemos.DocTest.run_doctest:main"
JupyterNotebookDemo = "nptsnedemos.TSNEJupyterNotebook.run_tsne_notebook:open_notebook"
GetDemoData = "nptsnedemos.GetDemoData.getdata:main"

[tool.uv]
package = true
# This forces uv to install the current project (the demos) into the venv
# so that "import nptsne_demos" works.

#[dependency-groups]
#dev = [
#    { include-group = "nptsne_demos" }
#]

[tool.uv.workspace]
members = []


[tool.uv.sources]
# Search internaal indexed for development purposes
nptsne = { index = "testpypi" }
nptsne = { index = "wheelhouse" }
nptsnedemos = { path = ".", editable = true }


[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple"
explicit = true

# Set the correct path in the url to work with a local wheel
[[tool.uv.index]]
name = "wheelhouse"
url = "file:///D:/TempProj/nptsne/wheelhouse"
format = "flat"
explicit = true

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
  "nptsnedemos", 
  "nptsnedemos.SimpleTsne",
  "nptsnedemos.BasicHSNEDemo",
  "nptsnedemos.HSNELouvainDemo"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
]

